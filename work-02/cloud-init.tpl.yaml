#cloud-config
# шаблон настройки машины; переменные подставляет create.sh через envsubst

users:
  - name: student                       # логин, под которым заходим по SSH
    groups: sudo                        # членство в группе даёт право на sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']    # без пароля: пароля у пользователя нет
    ssh_authorized_keys:
      - ${SSH_KEY}

package_update: true                    # обновить список пакетов перед установкой

packages:
  - nginx                               # ставится при первой загрузке машины

runcmd:
  # меняем порт в конфигурации nginx: сначала IPv4, потом IPv6
  - sed -i 's/listen 80 default_server;/listen ${APP_PORT} default_server;/' /etc/nginx/sites-available/default
  - sed -i 's/listen \[::\]:80 default_server;/listen [::]:${APP_PORT} default_server;/' /etc/nginx/sites-available/default
  # страницу перезаписываем целиком: слово варианта и имя машины в одной строке
  - bash -c 'echo "${GREETING} on $(hostname)" > /var/www/html/index.nginx-debian.html'
  # дополнительный диск: размечается и монтируется, только если подключён к этой машине;
  # путь записан явно, без переменных оболочки, чтобы подстановка шаблона его не затронула
  - |
    if [ -b /dev/disk/by-id/virtio-data ]; then
      blkid /dev/disk/by-id/virtio-data || mkfs.ext4 -L data /dev/disk/by-id/virtio-data
      mkdir -p /mnt/data
      grep -q virtio-data /etc/fstab || echo '/dev/disk/by-id/virtio-data  /mnt/data  ext4  defaults,nofail  0  2' >> /etc/fstab
      mountpoint -q /mnt/data || mount /mnt/data
      echo "data-disk: смонтирован в /mnt/data"
    else
      echo "data-disk: устройства нет, разметка пропущена"
    fi
  - nginx -t                            # проверка конфигурации: опечатка вылезет здесь
  - systemctl restart nginx             # последней командой: её ошибка даст status: error
